<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07101f"><title>Komisi Capster by Doel</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="app">
    <header class="app-header"><div class="brand-icon">✂</div><div><h1>KOMISI <span>CAPSTER</span></h1><p>BY DOEL</p></div><button id="settingsBtn" class="icon-btn" aria-label="Pengaturan">⚙</button></header>
    <section class="summary gradient">
      <div class="summary-total"><p>TOTAL KOMISI HARI INI</p><strong id="totalToday">Rp0</strong><div class="summary-split"><div>Potong biasa<strong id="cutTotal">Rp0</strong></div><div>Menu servis<strong id="serviceTotal">Rp0</strong></div></div></div>
      <div class="date-area"><label for="recapDate">TANGGAL REKAP</label><input id="recapDate" type="date"></div>
    </section>
    <section class="panels">
      <article class="panel"><div class="panel-title"><span class="number lime">01</span><h2>Potong Biasa</h2></div><label for="cutCount">Jumlah potong</label><div class="counter"><button id="cutMinus" aria-label="Kurangi potong">−</button><input id="cutCount" type="number" min="0" inputmode="numeric" value="0"><button id="cutPlus" aria-label="Tambah potong">+</button></div><div class="commission"><span>Komisi potong biasa</span><strong id="cutCommission">Rp0</strong><small>1–5: Rp5.000 · 6–9: Rp7.500 · 10+: Rp10.000 per potong</small></div></article>
      <article class="panel"><div class="panel-title"><span class="number blue">02</span><h2>Menu Servis</h2></div><label for="serviceType">Jenis servis</label><select id="serviceType"><option value="Hairspa">Hairspa</option><option value="Premium">Premium</option><option value="Clasiy">Clasiy</option><option value="Royal">Royal</option><option value="Perming">Perming</option><option value="Smoothing">Smoothing</option></select><label for="serviceCount">Jumlah pelanggan</label><div class="counter"><button id="serviceMinus" aria-label="Kurangi pelanggan">−</button><input id="serviceCount" type="number" min="0" inputmode="numeric" value="0"><button id="servicePlus" aria-label="Tambah pelanggan">+</button></div><div class="commission"><span id="serviceCommissionLabel">Komisi Hairspa</span><strong id="serviceCommission">Rp0</strong><small id="serviceRate">Tarif Rp5.000 per pelanggan</small></div></article>
    </section>
    <section class="actions"><button id="saveBtn" class="primary">Simpan Rekap Hari Ini</button><button id="copyBtn" class="secondary">Salin Rekap</button></section>
    <section class="history panel"><div class="history-head"><h2>Riwayat Rekap</h2><button id="clearHistory" class="text-btn">Hapus riwayat</button></div><div id="historyList" class="history-list"><p class="empty">Belum ada rekap tersimpan.</p></div></section>
    <nav class="bottom-nav"><button class="active" data-target="top">⌂<span>Beranda</span></button><button data-target="history">◷<span>Riwayat</span></button><button id="navCopy">▢<span>Salin Rekap</span></button></nav>
    <div id="toast" class="toast" role="status"></div>
  </main>
  <script src="app.js"></script>
</body></html>
